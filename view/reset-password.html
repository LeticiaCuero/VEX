<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>VEX - Nova senha</title>
    <link rel="stylesheet" href="/style/login.css">
    <script src="/script/reset-password.js" defer></script>
    <link rel="icon" href="/img/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png">
</head>
<body>
    <main class="login">
        <div class="login-box">
            <a href="/" aria-label="Voltar ao início"><img src="/img/Vex.png" alt="VEX" class="login-logo"></a>
            <h1>Definir nova senha</h1>
            <p id="reset-message" role="status" aria-live="polite"></p>
            <form id="reset-form">
                <label for="new-password">Nova senha</label>
                <input type="password" id="new-password" name="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Pelo menos 8 caracteres" required>
                <label for="confirm-password">Confirmar senha</label>
                <input type="password" id="confirm-password" name="confirmation" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Repita a nova senha" required>
                <button class="btn" type="submit">Salvar senha</button>
            </form>
            <a class="register-link" href="/view/login.html">Voltar ao login</a>
        </div>
    </main>
</body>
</html>
