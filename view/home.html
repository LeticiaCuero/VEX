<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX - Cadastro de Veiculos</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/home.css">
    <script src="../script/api.js" defer></script>
    <script src="../script/sidebar.js" defer></script>
    <script src="../script/home.js" defer></script>
</head>

<body>
    <div data-site-sidebar></div>
    <main>
        <div class="content">
            <section class="register-box" id="register" aria-labelledby="register-title">
                <div class="panel-heading">
                    <span class="section-label">Check-in</span>
                    <h2 id="register-title">Cadastro de veiculos</h2>
                </div>
                <form method="post">
                    <div class="field">
                        <label for="placa">Placa do veiculo</label>
                        <input type="text" id="placa" name="placa" required>
                    </div>
                    <div class="field">
                        <label for="modelo">Modelo do veiculo</label>
                        <input type="text" id="modelo" name="modelo" required>
                    </div>
                    <div class="field">
                        <label for="marca">Marca do veiculo</label>
                        <input type="text" id="marca" name="marca" required>
                    </div>
                    <div class="field">
                        <label for="cor">Cor do veiculo</label>
                        <input type="text" id="cor" name="cor" required>
                    </div>
                    <div class="field">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" autocomplete="off" required>
                    </div>
                    <div class="field">
                        <label for="tipo">Veiculo</label>
                        <select id="tipo" name="tipo" required>
                            <option value="" selected disabled>Selecione</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="estadia">Estadia</label>
                        <select id="estadia" name="estadia" required>
                            <option value="" selected disabled>Selecione</option>
                        </select>
                    </div>
                    <div class="field field--full">
                        <p class="rate-preview" id="rate-preview">Selecione veiculo e estadia para ver os valores.</p>
                    </div>
                    <div class="field field--action">
                        <button type="submit" class="btn-register">Registrar</button>
                    </div>
                </form>
            </section>

            <section class="history-box" id="pending" aria-labelledby="pending-title">
                <div class="panel-heading">
                    <span class="section-label">Check-out</span>
                    <h2 id="pending-title">Entradas em aberto</h2>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Placa</th>
                                <th>Veiculo</th>
                                <th>CPF</th>
                                <th>Veiculo</th>
                                <th>Entrada</th>
                                <th>Acao</th>
                            </tr>
                        </thead>
                        <tbody id="pending-table">
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div class="exit-modal" aria-hidden="true">
        <div class="exit-modal__backdrop" data-exit-cancel></div>
        <div class="exit-modal__box" role="dialog" aria-modal="true" aria-labelledby="exit-modal-title">
            <h2 id="exit-modal-title">Confirmar saida</h2>
            <div class="exit-modal__summary" id="exit-summary"></div>
            <div class="exit-modal__actions">
                <button class="exit-modal__cancel" type="button" data-exit-cancel>Cancelar</button>
                <button class="exit-modal__confirm" type="button" data-exit-confirm>Confirmar saida</button>
            </div>
        </div>
    </div>
</body>

</html>
