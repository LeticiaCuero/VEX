<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vex - Histórico</title>
    <link rel="stylesheet" href="../style/sidebar.css">
    <link rel="stylesheet" href="../style/history.css">
    <script src="../script/sidebar.js" defer></script>
</head>

<body>
    <div data-site-sidebar></div>
    <main>
        <div class="content">
            <section class="history-box" id="history" aria-labelledby="history-title">
                <h1 id="history-title">Histórico de Entradas e Saídas</h1>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Placa</th>
                                <th>Modelo</th>
                                <th>Marca</th>
                                <th>Cor</th>
                                <th>CPF do Proprietário</th>
                                <th>Tipo de Veículo</th>
                                <th>Data e Hora de Entrada</th>
                                <th>Data e Hora de Saída</th>
                            </tr>
                        </thead>
                        <tbody id="history-table">
                            <!-- As linhas da tabela serão preenchidas dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
