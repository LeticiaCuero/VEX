<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vex - Historico</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/history.css">
    <script src="../script/api.js" defer></script>
    <script src="../script/sidebar.js" defer></script>
    <script src="../script/history.js" defer></script>
</head>

<body>
    <div data-site-sidebar></div>
    <main>
        <div class="content">
            <section class="history-box" id="history" aria-labelledby="history-title">
                <h1 id="history-title">Historico de Entradas e Saidas</h1>
                <div class="history-tools">
                    <label for="history-search">Buscar</label>
                    <input type="search" id="history-search" placeholder="Placa, modelo, CPF, tipo ou data">
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Placa</th>
                                <th>Modelo</th>
                                <th>Marca</th>
                                <th>Cor</th>
                                <th>CPF do Proprietario</th>
                                <th>Tipo de Veiculo</th>
                                <th>Data e Hora de Entrada</th>
                                <th>Data e Hora de Saida</th>
                            </tr>
                        </thead>
                        <tbody id="history-table">
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
