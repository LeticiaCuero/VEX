<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX - Historico</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/history.css">
    <link rel="stylesheet" href="../style/popup.css">
    <script src="../script/popup.js" defer></script>
    <script src="../script/api.js" defer></script>
    <script src="../script/sidebar.js" defer></script>
    <script src="../script/history.js" defer></script>
    <link rel="icon" href="/img/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png">
</head>

<body>
    <div data-site-sidebar></div>
    <main>
        <div class="content">
            <section class="history-box" id="history" aria-labelledby="history-title">
                <div class="history-header">
                    <div>
                        <span>Historico</span>
                        <h1 id="history-title">Entradas e saidas</h1>
                    </div>
                    <div class="history-tools">
                        <label for="history-search">Buscar</label>
                        <input type="search" id="history-search" placeholder="Digite a placa">
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Veiculo</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="history-table">
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
