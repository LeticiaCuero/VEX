<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX - Tarifa</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/config.css">
    <link rel="stylesheet" href="../style/popup.css">
    <script src="../script/popup.js" defer></script>
    <script src="../script/api.js" defer></script>
    <script src="../script/sidebar.js" defer></script>
    <script src="../script/config.js" defer></script>
    <link rel="icon" href="/img/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png">
</head>
<body>
    <div data-site-sidebar></div>
    <main class="tariff">
        <div class="tariff-heading">
            <h1>Tarifas</h1>
            <button class="btn" type="button" data-open-tariff>Nova tarifa</button>
        </div>

        <dialog class="modal tariff-modal" aria-labelledby="tariff-modal-title">
            <div class="modal-header">
                <h2 id="tariff-modal-title">Nova tarifa</h2>
                <button class="modal-close" type="button" aria-label="Fechar modal" data-close-tariff>×</button>
            </div>
            <div class="modal-content">
                <form class="tax-form tariff-form" method="post">
                    <div class="field">
                        <label for="vehicle-type">Veículo</label>
                        <input type="text" name="vehicle-type" id="vehicle-type" placeholder="Ex.: Moto" required>
                    </div>
                    <div class="field">
                        <label for="stay-type">Tipo de estadia</label>
                        <select name="stay-type" id="stay-type" required>
                            <option value="" selected disabled>Selecione</option>
                            <option value="minute">Minuto</option>
                            <option value="daily">Diária</option>
                            <option value="monthly">Mensal</option>
                        </select>
                    </div>
                    <div class="field" data-minutes-field hidden>
                        <label for="stay-minutes">Quantidade de minutos</label>
                        <input type="number" name="stay-minutes" id="stay-minutes" min="1" step="1" placeholder="Ex.: 30" disabled>
                    </div>
                    <div class="field">
                        <label for="value">Valor inicial (R$)</label>
                        <input type="number" name="value" id="value" min="0" step="0.01" placeholder="0,00" required>
                    </div>
                    <div class="field">
                        <label for="additional-hour">Adicional por hora (R$) — opcional</label>
                        <input type="number" name="additional-hour" id="additional-hour" min="0" step="0.01" placeholder="0,00">
                    </div>
                    <p class="tariff-message" data-tariff-error role="alert" hidden></p>
                    <button class="btn" type="submit">Salvar</button>
                </form>
            </div>
        </dialog>

        <dialog class="modal tariff-modal delete-tariff-modal" aria-label="Confirmar exclusão" aria-describedby="delete-tariff-description">
            <div class="modal-content">
                <p id="delete-tariff-description">Deseja excluir esta tarifa? Esta ação não pode ser desfeita.</p>
                <p class="delete-tariff-summary" data-delete-summary></p>
                <p class="tariff-message" data-delete-error role="alert" hidden></p>
                <div class="delete-tariff-actions">
                    <button class="delete-tariff-cancel" type="button" data-cancel-delete autofocus>Cancelar</button>
                    <button class="delete-tariff-confirm" type="button" data-confirm-delete>Excluir</button>
                </div>
            </div>
        </dialog>

        <section class="tariff-list" aria-label="Lista de tarifas">
            <div class="rate-list" id="config-table"></div>
        </section>
    </main>
</body>
</html>
