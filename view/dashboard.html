<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX - Dashboard</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/dashboard.css">
    <link rel="stylesheet" href="../style/popup.css">
    <script src="../script/popup.js" defer></script>
    <script src="../script/api.js" defer></script>
    <script src="../script/sidebar.js" defer></script>
    <script src="../script/dashboard.js" defer></script>
    <link rel="icon" href="/img/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png">
</head>

<body>
    <div data-site-sidebar></div>
    <main>
        <div class="content">
            <section class="dashboard-box" id="dashboard" aria-labelledby="dashboard-title">
                <div class="kpi-grid" id="kpi-grid"></div>

                <div class="analytics-grid">
                    <article class="chart-card chart-card--wide">
                        <div class="chart-heading">
                            <div>
                                <h2>Movimento dos ultimos 7 dias</h2>
                            </div>
                            <strong id="peak-day-label">-</strong>
                        </div>
                        <div class="column-chart" id="daily-chart"></div>
                    </article>

                    <article class="chart-card">
                        <div class="chart-heading">
                            <div>
                                <h2>Faturamento</h2>
                            </div>
                            <strong id="revenue-total">R$ 0,00</strong>
                        </div>
                        <div class="revenue-chart" id="revenue-chart"></div>
                    </article>

                    <article class="chart-card">
                        <div class="chart-heading">
                            <div>
                                <h2>Entradas por horario</h2>
                            </div>
                            <strong id="peak-hour-label">-</strong>
                        </div>
                        <div class="hour-chart" id="hour-chart"></div>
                    </article>

                    <article class="chart-card chart-card--wide">
                        <div class="chart-heading">
                            <div>
                                <h2>Total por tipo de veiculo</h2>
                            </div>
                        </div>
                        <div class="type-chart" id="type-chart"></div>
                    </article>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
